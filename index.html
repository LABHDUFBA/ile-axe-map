<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilê Axé Map — Terreiros de Candomblé da Bahia</title>
  <meta name="description" content="Mapa interativo dos terreiros de candomblé (ilê axé) da Bahia. Dados abertos do OpenStreetMap.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Georgia', 'Times New Roman', serif; background: #0a0a0a; color: #e8e0d0; overflow: hidden; }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Sidebar */
    #sidebar {
      position: absolute; top: 0; left: 0; width: 380px; height: 100vh;
      background: rgba(15, 12, 8, 0.95); backdrop-filter: blur(10px);
      border-right: 1px solid #3a2f20; z-index: 10; overflow-y: auto;
      transform: translateX(-380px); transition: transform 0.3s ease;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-content { padding: 24px; }
    #sidebar-content h2 { font-size: 1.4em; color: #d4a843; margin-bottom: 8px; }
    #sidebar-content .nacao { font-size: 0.85em; color: #8b7355; margin-bottom: 12px; }
    #sidebar-content .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2520; font-size: 0.9em; }
    #sidebar-content .info-row .label { color: #8b7355; }
    #sidebar-content .info-row .value { color: #e8e0d0; text-align: right; max-width: 220px; }
    #sidebar-content .close-btn { position: absolute; top: 16px; right: 16px; cursor: pointer; color: #8b7355; font-size: 1.5em; }

    /* Header panel */
    #header {
      position: absolute; top: 20px; left: 20px; z-index: 5;
      max-width: 420px; pointer-events: none;
    }
    #header .title { font-size: 2.2em; font-weight: bold; color: #d4a843; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); letter-spacing: 1px; }
    #header .subtitle { font-size: 1.1em; color: #c8b890; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); margin-top: 4px; }
    #header .stats { font-size: 0.85em; color: #8b7355; margin-top: 8px; }

    /* Filter panel */
    #filters {
      position: absolute; top: 20px; right: 20px; z-index: 5;
      background: rgba(15, 12, 8, 0.9); backdrop-filter: blur(10px);
      border: 1px solid #3a2f20; border-radius: 8px; padding: 16px;
      pointer-events: auto; max-width: 220px;
    }
    #filters h3 { font-size: 0.9em; color: #d4a843; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .filter-btn {
      display: inline-block; padding: 4px 12px; margin: 3px;
      background: transparent; border: 1px solid #3a2f20; border-radius: 16px;
      color: #8b7355; font-size: 0.8em; cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .filter-btn.active { background: #3a2f20; color: #d4a843; border-color: #d4a843; }
    .filter-btn:hover { color: #d4a843; border-color: #d4a843; }

    /* Footer */
    #footer {
      position: absolute; bottom: 12px; left: 20px; z-index: 5;
      font-size: 0.75em; color: #5a4a35;
    }
    #footer a { color: #8b7355; text-decoration: none; }
    #footer a:hover { color: #d4a843; }

    /* Marker popup */
    .maplibregl-popup-content {
      background: rgba(15, 12, 8, 0.95) !important; color: #e8e0d0 !important;
      border-radius: 8px; border: 1px solid #3a2f20; padding: 12px 16px;
      font-family: 'Georgia', serif;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(15,12,8,0.95) !important; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(15,12,8,0.95) !important; }
    .maplibregl-popup h3 { color: #d4a843; font-size: 1em; margin-bottom: 4px; }
    .maplibregl-popup .popup-info { font-size: 0.8em; color: #8b7355; }

    /* Mobile */
    @media (max-width: 768px) {
      #header { max-width: 90%; }
      #header .title { font-size: 1.5em; }
      #filters { max-width: 180px; top: auto; bottom: 50px; right: 10px; }
      #sidebar { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="header">
    <div class="title">ILÊ AXÉ MAP</div>
    <div class="subtitle">Terreiros de Candomblé da Bahia</div>
    <div class="stats" id="stats">Carregando...</div>
  </div>

  <div id="filters">
    <h3>Nação</h3>
    <div id="filter-buttons"></div>
  </div>

  <div id="sidebar">
    <div id="sidebar-content"></div>
  </div>

  <div id="footer">
    Dados: <a href="https://www.openstreetmap.org" target="_blank">OpenStreetMap</a> ·
    <a href="https://github.com/LABHDUFBA/terreiro-map" target="_blank">LABHD/UFBA</a> ·
    <a href="data/terreiros.geojson" download>Download GeoJSON</a>
  </div>

  <script>
    // ============ MAP ============
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'raster',
            tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [-38.5, -12.9],
      zoom: 10
    });

    // Dark overlay
    map.on('load', () => {
      map.addSource('dark-overlay', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[[-180,-90],[-180,90],[180,90],[180,-90],[-180,-90]]] } }
      });
    });

    // ============ DATA ============
    let allFeatures = [];
    let activeFilters = new Set();

    map.on('load', async () => {
      const resp = await fetch('data/terreiros.geojson');
      const data = await resp.json();
      allFeatures = data.features;

      // Classificar nação
      allFeatures.forEach(f => {
        const p = f.properties;
        let nacao = 'Outro';
        const rel = (p.religion || '').toLowerCase();
        const den = (p.denomination || '').toLowerCase();
        const name = (p.name || '').toLowerCase();
        if (rel.includes('angola') || den.includes('angola')) nacao = 'Angola';
        else if (rel.includes('ketu') || den.includes('ketu') || den.includes('alaketo')) nacao = 'Ketu';
        else if (rel.includes('jeje') || den.includes('jeje')) nacao = 'Jeje';
        else if (rel.includes('candombl') || den.includes('candombl')) nacao = 'Candomblé';
        else if (rel.includes('afro') || rel.includes('matriz')) nacao = 'Matriz Africana';
        f.properties._nacao = nacao;
      });

      // Stats
      document.getElementById('stats').textContent = `${allFeatures.length} terreiros mapeados`;

      // Build filters
      const nacoes = [...new Set(allFeatures.map(f => f.properties._nacao))].sort();
      const fb = document.getElementById('filter-buttons');
      nacoes.forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn active';
        btn.textContent = n;
        btn.onclick = () => {
          if (activeFilters.has(n)) { activeFilters.delete(n); btn.classList.remove('active'); }
          else { activeFilters.add(n); btn.classList.add('active'); }
          updateMarkers();
        };
        activeFilters.add(n);
        fb.appendChild(btn);
      });

      addMarkers();
    });

    // ============ MARKERS ============
    const markers = [];

    function addMarkers() {
      const colors = {
        'Ketu': '#d4a843', 'Angola': '#c45838', 'Jeje': '#6b8e23',
        'Candomblé': '#cd853f', 'Matriz Africana': '#daa520', 'Outro': '#8b7355'
      };

      allFeatures.forEach(f => {
        const nacao = f.properties._nacao;
        const color = colors[nacao] || '#8b7355';
        const el = document.createElement('div');
        el.style.width = '12px'; el.style.height = '12px';
        el.style.borderRadius = '50%';
        el.style.background = color;
        el.style.border = '2px solid rgba(255,255,255,0.4)';
        el.style.cursor = 'pointer';
        el._feature = f;

        const marker = new maplibregl.Marker(el)
          .setLngLat(f.geometry.coordinates)
          .addTo(map);

        el.addEventListener('click', () => showSidebar(f));
        el.addEventListener('mouseenter', () => showPopup(f, el));
        markers.push({ marker, nacao, el });
      });
    }

    function updateMarkers() {
      markers.forEach(m => {
        const show = activeFilters.has(m.nacao);
        m.el.style.display = show ? 'block' : 'none';
      });
    }

    // ============ POPUP ============
    let currentPopup = null;
    function showPopup(f, el) {
      if (currentPopup) currentPopup.remove();
      const p = f.properties;
      const html = `<h3>${p.name || 'Terreiro'}</h3><div class="popup-info">${p._nacao}${p.religion ? ' · ' + p.religion : ''}</div>`;
      currentPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 })
        .setHTML(html)
        .setLngLat(f.geometry.coordinates)
        .addTo(map);
    }

    // ============ SIDEBAR ============
    function showSidebar(f) {
      const p = f.properties;
      const content = document.getElementById('sidebar-content');
      const rows = [];
      const fields = [
        ['name', 'Nome'], ['_nacao', 'Nação'], ['religion', 'Religião'],
        ['denomination', 'Denominação'], ['amenity', 'Tipo'],
        ['addr:street', 'Rua'], ['addr:housenumber', 'Número'],
        ['addr:suburb', 'Bairro'], ['addr:city', 'Cidade'],
        ['addr:postcode', 'CEP'], ['phone', 'Telefone'],
        ['start_date', 'Fundação'], ['osm_id', 'OSM ID']
      ];
      fields.forEach(([key, label]) => {
        if (p[key] && p[key] !== 'Não Informado' && p[key] !== 'Não Informada') {
          rows.push(`<div class="info-row"><span class="label">${label}</span><span class="value">${p[key]}</span></div>`);
        }
      });
      const lat = f.geometry.coordinates[1].toFixed(6);
      const lon = f.geometry.coordinates[0].toFixed(6);
      rows.push(`<div class="info-row"><span class="label">Coordenadas</span><span class="value">${lat}, ${lon}</span></div>`);

      content.innerHTML = `
        <span class="close-btn" onclick="document.getElementById('sidebar').classList.remove('open')">✕</span>
        <h2>${p.name || 'Terreiro'}</h2>
        <div class="nacao">${p._nacao || ''}</div>
        ${rows.join('')}
        <div style="margin-top:16px"><a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=18/${lat}/${lon}" target="_blank" style="color:#d4a843;font-size:0.85em">Ver no OpenStreetMap →</a></div>
      `;
      document.getElementById('sidebar').classList.add('open');
    }
  </script>
</body>
</html>
